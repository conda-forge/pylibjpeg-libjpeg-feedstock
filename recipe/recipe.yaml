schema_version: 1

context:
  name: pylibjpeg-libjpeg
  version: "2.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pylibjpeg_libjpeg-${{ version }}.tar.gz
  sha256: fa78f090632aa712ac7c235d2d4bee30b85b19f9c6801375ec3b36558550e1d7

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: win
      then:
        - ${{ compiler('m2w64_cxx') }}
        - ${{ stdlib("m2w64_c") }}
      else:
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
  host:
    - cython >=3.0.10
    - numpy >=2.0.0,<3.0.0
    - pip
    - poetry-core >=1.8,<2
    - python
    - setuptools
  run:
    - python
    - numpy >=2.0.0,<3.0.0
    - cython >=3.0.10
  ignore_run_exports:
    by_name:
      - cython
      - numpy
      - python

tests:
  - python:
      imports:
        - libjpeg
  - requirements:
      run:
        - cython >=3.0.10
        - pip
        - python
    script:
      - pip check

about:
  homepage: https://github.com/pydicom/${{ name }}
  license: GPL-3.0-only
  license_file: LICENSE
  summary: A Python wrapper for libjpeg, with a focus on use as a plugin for for pylibjpeg

extra:
  recipe-maintainers:
    - psadil
    - scaramallion
